<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="{{hljsCssUri}}">
<link rel="stylesheet" href="{{cssUri}}">
</head>
<body data-hook="{{hookConfigured}}">
<div id="empty" class="hidden">En attente d'un plan Claude Code…</div>
<div id="setup" class="hidden">
  <div class="setup-card">
    <div id="setup-config">
      <div class="setup-title" id="setup-title"></div>
      <div class="setup-text" id="setup-text"></div>
      <button id="setup-btn"></button>
    </div>
    <div id="setup-done" class="hidden">
      <div class="setup-title" id="setup-done-title"></div>
      <div class="setup-text" id="setup-done-text"></div>
    </div>
  </div>
</div>
<div id="content" class="hidden">
  <div id="hint">Sélectionne du texte dans le plan pour le <b>commenter</b>, proposer un <b>remplacement</b> ou le <b>supprimer</b>.</div>
  <div id="markdown"></div>
  <div id="annotations" class="hidden">
    <div class="ann-head">Annotations (<span id="ann-count">0</span>)</div>
    <div id="ann-list"></div>
  </div>
  <div id="actions">
    <textarea id="feedback" placeholder="Retour général à envoyer à Claude pour affiner le plan… (optionnel si tu as des annotations)"></textarea>
    <div id="buttons">
      <button id="send">Renvoyer avec ce retour</button>
      <button id="approve">Approuver le plan</button>
    </div>
  </div>
</div>

<div id="sel-toolbar" class="hidden">
  <button data-action="comment">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    <span>Commenter</span>
  </button>
  <button data-action="replace">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
    <span>Remplacer</span>
  </button>
  <button data-action="delete">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
    <span>Supprimer</span>
  </button>
</div>

<div id="ctx-menu" class="hidden">
  <button data-action="cut">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg>
    <span>Couper</span>
  </button>
  <button data-action="copy">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
    <span>Copier</span>
  </button>
  <button data-action="paste">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
    <span>Coller</span>
  </button>
  <div class="ctx-sep"></div>
  <button data-action="comment">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    <span>Commenter</span>
  </button>
  <button data-action="replace">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
    <span>Remplacer</span>
  </button>
  <button data-action="delete">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
    <span>Supprimer</span>
  </button>
</div>

<div id="ann-popover" class="hidden">
  <div class="pop-quote"></div>
  <textarea id="pop-input"></textarea>
  <div class="pop-buttons">
    <button id="pop-cancel">Annuler</button>
    <button id="pop-ok">Ajouter</button>
  </div>
</div>

<div id="modal-overlay" class="hidden">
  <div id="modal" role="dialog" aria-modal="true">
    <div id="modal-title">Annotations non envoyées</div>
    <div id="modal-text"><span id="modal-text-a">Tu as </span><span id="modal-count">0</span><span id="modal-text-b"> annotation(s) sur ce plan.</span></div>
    <div id="modal-buttons">
      <button id="modal-send">Renvoyer avec mes annotations</button>
      <button id="modal-approve">Approuver sans envoyer</button>
      <button id="modal-cancel">Annuler</button>
    </div>
  </div>
</div>

<script src="{{hljsUri}}"></script>
<script src="{{jsUri}}"></script>
</body>
</html>
